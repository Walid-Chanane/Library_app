<h2>My borrowed books</h2>
<hr>
<div>
    <table class="table">
        <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">Title</th>
                <th scope="col">Author</th>
                <th scope="col">Publisher</th>
                <th scope="col">ISBN</th>
                <th scope="col">Rate</th>
                <th scope="col"><i class="fas fa-cogs"></i></th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let book of borrowedBooks.content; let index = index">
                <th scope="row">{{index + 1}}</th>
                <td>{{book.title}}</td>
                <td>{{book.author}}</td>
                <td>{{book.publisher}}</td>
                <td>{{book.isbn}}</td>
                <td><i class="fas fa-star text-warning"></i>{{book.rate}}</td>
                <td>
                    <div class="d-flex gap-2">
                        <i *ngIf="book.returned" class="fa-regular fa-paper-plane text-primary"></i>
                        <i *ngIf="!book.returned" (click)="returnBorrowedBook(book)" class="fas fa-paper-plane text-success"></i>
                        <i class="fas fa-circle-check" [class.text-success]="book.returnApproved"></i>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</div>


<div class="d-flex justify-content-center mt-3">
    <nav aria-label="page navigation">
        <ul class="pagination">
            <li class="page-item">
                <a (click)="goToFirstPage()"
                class="page-link"
                href="javascript:void(0)"
                aria-label="previous"
                 [class.disabled]="page == 0"> <!--NOTE: we can also use the "first" and "last" fields in the bookresponse -->
                <i class="fas fa-angles-left"></i>
                </a>

                <a (click)="goToPreviousPage()"
                href="javascript:void(0)"
                class="page-link"
                aria-label="next"
                [class.disabled]="page == 0">
                <i class="fas fa-angle-left"></i>
                </a>
            </li>
            <li class="page-item" *ngFor="let _ of [].constructor(this.borrowedBooks); let pageIndex = index">
                <a (click)="goToPage(pageIndex)"
                href="javascript:void(0)"
                class="page-link"
                aria-label="page"
                [class.active]="page == pageIndex">
                {{pageIndex + 1}}
                </a>
            </li>
            <li class="page-item">
                <a (click)="goToNextPage()"
                class="page-link"
                href="javascript:void(0)"
                aria-label="next"
                [class.disabled]="isLastPage">
                <i class="fas fa-chevron-right"></i>
                </a>

                <a (click)="goToLastPage()"
                href="javascript:void(0)"
                class="page-link"
                aria-label="last"
                [class.disabled]="isLastPage">
                <i class="fas fa-angle-right"></i>
                </a>
            </li>
        </ul>
    </nav>
</div>

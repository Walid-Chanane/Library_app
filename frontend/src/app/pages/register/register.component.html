<div class="container-fluid card login-container">
    <h3 class="text-center">Registeration</h3>
    <hr>
    <div class="alert alert-danger" role="alert" *ngIf="errors.length">
      <p *ngFor="let msg of errors">{{msg}}</p>
    </div>
    <div class="mb-3">
      <label for="firstname" class="form-label">Firstname</label>
      <input [(ngModel)]="registrationRequest.firstName" type="text" class="form-control" id="firstname" placeholder="John">
    </div>
    <div class="mb-3">
        <label for="lastname" class="form-label">Lastname</label>
        <input [(ngModel)]="registrationRequest.lastName" type="text" class="form-control" id="lastname" placeholder="Doe">
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input [(ngModel)]="registrationRequest.email" type="email" class="form-control" id="email" placeholder="example@email.com">
    </div>  
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input [(ngModel)]="registrationRequest.password" type="password" class="form-control" id="password" placeholder="password">
    </div>
    <div class="d-flex justify-content-between mb-3">
      <button (click)="register()" type="button" class="btn btn-primary">
        <em class="fas fa-sign-in-alt">&nbsp;Register</em>
      </button>
      <div>
        Already have an account?&nbsp;
        <button (click)="login()" type="button" class="btn btn-link">Login</button>
      </div>
    </div>
  </div>

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>account_validation</title>
    <style>
        body{
            font-family: Arial Nova, sans-serif;
            background-color: #839bb5;
            margin-left: 10%;
        }
        .container{
            background-color: white;
            border-radius: 10px;
            padding: 5%;
            width: 80%;
            text-align: center;
        }
        .btn{
            background-color: #245bc6;
            color: white;
            padding-bottom: 0;
            padding-top: 2px;
            text-align: center;
            width: 30%;
            height: 0.7cm;
            border-radius: 5px;
            margin-left: 35%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Account validation</h1>
        <div><p th:text="'Dear ' + ${username} + ',' "></p></div>
        <p>Please use the following activation code to activate your account:</p>
        <div><p th:text="'Code: ' + ${activationCode}" style="font-weight: bold"></p></div>
        <div class="btn"><a th:href="${confirmationUrl}" target="_blank">Activate your account</a></div>
        <p>Once activated, you'll be able to log in with your new account.</p>
    </div>
</body>
</html>
